# Run settings (see src/main/kotlin/inflation/Config.kt).
#
# Copy this file to inflation.properties in the directory a run starts in (the project directory for
# the Gradle tasks), or give another file with -Dhex.config=FILE, e.g. one per job on the server.
# Every key is optional: a key left out (or commented out, as all are here) keeps the default shown.
# Seeds, years, world size and the like stay on each tool's own command line (--seed, --years, ...).

# --- Learned networks and where runs keep things -------------------------------------------------

# Directory of learned role networks (herds.mlp, hunters.mlp, people.mlp, as training writes them);
# without it groups choose by the hand-written rules. The viewer's --nets DIR does the same.
#nets=runs/baselines/natufian-2
# Bands' ways network; herds' and packs' ways networks.
#ways=runs/baselines/natufian-2/ways.mlp
#herdWays=
#hunterWays=
# Where named baselines live.
#baselines=runs/baselines

# --- What the world has in it --------------------------------------------------------------------

# Yearly rounds for herds and bands' rites (on by default).
#rounds=true
# Wolves becoming dogs (still to be decided, off by default).
#taming=false
# People in the world (false: animals only, for comparison; hex-hunger-check, hex-rounds-check, hex-forage-check).
#people=true
# A cooling or drying of the climate: startYear,years,degrees,rainShare (e.g. 20,1200,-4,0.7).
#climateShock=

# --- Caches and profiling ------------------------------------------------------------------------

# The generated world and its landforms are cached in ~/.inflation (false: always generate afresh).
#worldCache=true
#landformCache=true
# fine: time spent in each finer part of the step.
#profile=

# --- Tracing (hexFauna) --------------------------------------------------------------------------

# A kind whose hungry and thirsty groups are traced.
#huntDiag=
# A kind whose herds' reasons the plan prints once a month.
#planDiag=
# A kind whose foraging is traced.
#forageDiag=
# Follow one group of a kind week by week, as the viewer's follow window does.
#follow=
# Each month, how far a kind's herds are from the place they remember for the month.
#migDiag=
# Fed and hungry groups in year 2.
#fedDiag=false

# --- Tuning (each named in a check's header when set) --------------------------------------------

# Multipliers on present rates (1 leaves them as they are).
#t.peopleOutbreak=1
#t.peopleSick=1
#t.plantHandling=1
#t.intraguildYoung=1
#t.humanOther=1
#t.humanYoung=1
#t.humanThirst=1
#t.campFouling=1
#t.marshFever=1
#t.humanBirths=1
#t.settledFertility=1
#t.coldCost=1
# Weeks between a content herd's weighing of its places.
#t.contentWeeks=2

# Plants and land.
#t.palatableFloor=0.5
#t.dryValue=0.65
#t.growFrom=2
#t.growSpan=13
#t.trampleHerb=0.005
#t.trampleShrub=0.01
#t.leafFall=4
#t.browseScale=3
#t.ignitions=0.01

# Small animals.
# Rodents' deaths a year from all causes but predators, cold, snow and hunger (under study: 3 gives voles' few-month lives and a 2-4x seasonal swing).
#t.rodentDeath=1.2

# Herds' and residents' numbers and forage.
#t.breedSpacing=1.5
#t.proteinDryGrass=0.375
#t.proteinStraw=0.2
#t.proteinLichen=0.3
#t.youngProteinDeaths=0.25

# Movement: sense of better country, heading, shunning hunters, dens.
#t.bearingPull=0.5
#t.nearKm=60
#t.fadeKm=50
#t.headingKeep=0.95
#t.headingMoved=0.5
#t.headingPull=2
#t.huntersHalf=1
#t.denMonths=3
#t.denKm=15

# Rounds and rites.
#t.roundStrength=1
#t.roundNetPull=1.5
#t.roundPull=1.5
#t.roundArrived=50
#t.roundTrekDays=4
#t.roundDrift=0.3
#t.roundSwitch=0.05
#t.roundStart=0.5
#t.roundKmCost=0.002
#t.riteMax=3

# Trade goods.
#t.poorStoneEdge=0.75
#t.poorStoneWear=1
#t.saltLack=0.15
#t.saltKeep=0.7
