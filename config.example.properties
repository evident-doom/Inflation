# Run settings (see src/main/kotlin/inflation/Config.kt).
#
# Copy this file to inflation.properties in the directory a run starts in (the project directory for
# the Gradle tasks), or give another file with -Dhex.config=FILE, e.g. one per job on the server.
# Every key is optional: a key left out (or commented out, as all are here) keeps the default shown.
# Seeds, years, world size and the like stay on each tool's own command line (--seed, --years, ...).

# --- Learned networks and where runs keep things -------------------------------------------------

# Directory of learned role networks (hunters.mlp, people.mlp, as training writes them);
# without it groups choose by the hand-written rules. The viewer reads it too.
#nets=runs/baselines/natufian-4
# Bands' ways network; packs' ways network.
#ways=runs/baselines/natufian-4/ways.mlp
#hunterWays=
# hex-fauna-check: the world's centre latitude in degrees (default 36).
#latitude=
# Where named baselines live.
#baselines=runs/baselines

# --- What the world has in it --------------------------------------------------------------------

# Bands' rites, sites through the year kept as customs (on by default; they no longer draw moves).
#rounds=true
# People in the world (false: animals only, for comparison; hex-hunger-check, hex-forage-check).
#people=true
# A cooling or drying of the climate: startYear,years,degrees,rainShare (e.g. 20,1200,-4,0.7).
#climateShock=

# hex-fauna-check: every kind spread evenly over the land at the start, instead of by its country.
#uniformStart=false

# --- Tools' settings -----------------------------------------------------------------------------

# hex-choice-effect: the week the choice is forced; from the week after, the chance each week that every
# band takes a random place other than the best and draws its ways as in training (0: none).
#choiceWarmWeeks=60
#choiceNoise=0
# hex-people-leverage: which choices to test: all, moves or ways.
#leverageTests=all
# hex-people-leverage: hold each way at these multiples of the scaffold's (0.5,1,1.5) for every band, in place of the outputs -2 and +2;
# and which ways to test (numbered from 0 in the order of the network's outputs; all if unset).
#leverageWayValues=
#leverageWays=
# hex-choice-effect: hold this one way (numbered from 0 as the network's outputs) at this multiple of the scaffold's (between 0 and 2) for the forced half of the bands,
# for one week and for the year (the variants force-1wk and force-52wk).
#choiceWay=
#choiceWayValue=1
# hex-dial-arms: bands in each arm, the weeks the ways are held and the return covers, the ways tried (numbers from 0, comma-separated;
# default all) and the multiples of the scaffold's they are held at (between 0 and 2).
#dialArmSize=100
#dialArmWeeks=26
#dialArmWays=
#dialArmValues=0.5,1.5
# hex-dial-arms: true makes one arm for each group of ways (the efforts, the time weights, the tools made first, the building, the storing, the
# single ways) and one for all, each band scrambling every way of its arm's group between the values at random, instead of one arm for each way.
#dialArmGroups=false
# hex-dial-arms: the share (0..1) of the bands under the most stress (the greater of their cold exposure odds and their hunger, as the nets read them after a first week) that the arms are dealt from; 0: all bands.
#dialArmStressTop=0
# hex-dial-arms: weeks the world runs on before the arms are dealt (to start them in another season).
#dialArmLeadWeeks=0

# --- Learning --------------------------------------------------------------------------------------

# hex-ppo: hidden units of each role's network; Adam step; how much of the hand-written score each role's
# network starts from (ROLE:X,..., e.g. people:0.5); choices recorded a year of each kind in each world,
# and how many times as many of people.
#ppo.hidden=48
#ppo.rate=0.0003
#ppo.residual=
#ppo.perKind=1500
#ppo.peopleChoices=8
# hex-ppo's ecosystem check: the test world it runs, for how many years, with how many weather draws,
# how many runs side by side, and each run's heap (GB).
#ppo.checkWorld=lake-1
#ppo.checkYears=10
#ppo.checkReplicates=3
#ppo.checkParallel=10
#ppo.checkHeapGb=12
# hex-ppo: whether fewer people in every weather keeps the hunters' new network out (default true; false lets through
# a hunters network that costs people; the people's network is always judged on them).
#ppo.hunterPeopleVeto=true
# hex-ppo: how many standard errors above none (over the weather draws) a role's own kinds must stand with its new network to be kept.
# (Needs 3 or more weathers: with 2 the error is very rough.)
#ppo.keepSigma=1
# hex-ppo: how many times as many of people's choices the critic learns from as their moves do (1: only the moves drawn; the rest of those
# recorded are groups that took their best, so the training worlds live as before).
#ppo.criticTimes=4
# hex-ppo: advantages are held within this many spreads of none (0: not held), so that a few collapses do not decide a round.
#ppo.advantageClip=3
# hex-ppo: how much a band's choice is also judged by the change it brought in its members' foreseen survival a year ahead
# (shaping by a potential; 0: judged by births and deaths alone).
#ppo.foreseenShape=1
# hex-ppo: whether learning the bands' ways also trains the people's mover beneath them (false: only the ways' own layers).
#ppo.waysTrainMover=true
# hex-ppo: how many times more a band under the hardest cold or hunger is recorded (drawn by chance, learnt from) than one at ease (0: all alike).
#ppo.stressBoost=0
# hex-ppo: the most of people's choices that are recorded, and so drawn by chance instead of the best (the target is ppo.perKind, times ppo.peopleChoices for people, per world-year; raise that too for a larger share to bind).
#ppo.maxShare=0.1
# hex-ppo: how much a band's move is judged by the deaths of cold and camp (cold, exposure, heat, camp fouling, wounds), which its ways act on more than its move (1: as any death; lower: the move is judged by them less, the ways by the other deaths, below, more).
#ppo.moverKitWeight=1
# hex-ppo: how much a band's ways draw is judged by the deaths of causes neither its food nor its kit act on (beasts, snakes, sickness, raids...), which its move acts on more than its ways (1: as any death).
#ppo.waysPlaceWeight=1
# hex-ppo: the most times the usual step that the first-layer weights from a hardly trained input (one added since the net was trained, say) take, in proportion to how far its weights lie below the inputs' average (1: no boost).
#ppo.smallInputBoost=1
# hex-ppo: the directory where a training world that has settled (the burn-in) is kept, and taken up by later starts of the same world instead of settling again (default ~/.inflation/settled-worlds; empty or off: settled afresh each start).
#ppo.settledWorlds=
# weather: the chance each year of an extra severe winter or drought year over a region, on top of the usual ones (for training worlds; 0: none).
#weather.stressYears=0
# hex-evolve-ways: the spread of the variants, the step, and hidden units of the ways network.
#evolveWays.sigma=0.05
#evolveWays.rate=0.02
#evolveWays.hidden=16

# --- Caches and profiling ------------------------------------------------------------------------

# The generated world and its landforms are cached in ~/.inflation (false: always generate afresh).
#worldCache=true
#landformCache=true
# fine: time spent in each finer part of the step.
#profile=

# --- Tracing (hexFauna) --------------------------------------------------------------------------

# A kind whose hungry and thirsty groups are traced.
#huntDiag=
# A kind whose groups' reasons the plan prints once a month.
#planDiag=
# A kind whose foraging is traced.
#forageDiag=
# Each week a band loses people to exposure, what its week's survival pass reckoned with and what came, on stderr (the first 400).
#warmDiag=false
# Each band-week its survival pass stopped short of a thatched hut, what thatching on would have done by the pass's own reckoning, in the census.
#thatchTrace=false
# Each band-week chosen by the hand-written score, what moved it: each part of its score where it went against staying, in the census.
#moveTrace=false
# Follow one group of a kind week by week, as the viewer's follow window does.
#follow=
# With follow: follow the hungriest group of that kind fed under 0.9, switching whenever it is fed again or gone.
#followHungry=false
# Residents caught by snow, cold, heat and drought, by kind, month and height, written to this CSV file.
#strandDiag=
# Every band's week, with the numbers it knew of itself and the ways its network set (needs ways=FILE), written to this CSV file
# (gzipped if the name ends in .gz).
#waysLog=
# Hold these ways at these multiples of the scaffold's for every band, whatever the network sets: WAY:VALUE,... (the way's number from 0
# in the order of the network's outputs; the value between 0 and 2, 1 the scaffold's), e.g. 7:1.5,12:0.5.
#waysForce=
# How the bands' ways act where the model reads them (how often each is read, away from 1, changes the outcome, is capped), counted
# over the run and written to this text file as it ends.
#dialUse=
# Fed and hungry groups in year 2.
#fedDiag=false
# The shrubs' ledger: what grew, died back, was browsed, frosted, flooded and burned.
#shrubDiag=false
# Each step of the hunt, counted by prey kind into the history.
#huntSteps=false
# The books: every stock of water and matter summed each step, and what each part of the step leaves over.
#audit=false

# --- Tuning (each named in a check's header when set) --------------------------------------------

# Multipliers on present rates (1 leaves them as they are).
#t.peopleOutbreak=1
#t.peopleSick=1
#t.plantHandling=1
#t.intraguildYoung=1
#t.humanOther=1
#t.humanYoung=1
#t.humanThirst=1
#t.campFouling=1
#t.marshFever=1
#t.humanBirths=1
#t.coldCost=1
#t.peopleStart=1
#t.peopleBand=1
#t.startDay=90
#t.startSettled=0
#t.startHerders=0
#t.planners=0

# Plants and land.
#t.palatableFloor=0.5
#t.dryValue=0.65
#t.growFrom=2
#t.growSpan=13
#t.trampleHerb=0.005
#t.leafFall=4
# How fast cured grass weathers where it stands, a year (falls into the litter, and loses its protein toward straw's); 0: no weathering.
#t.hayWeathering=1.8
#t.browseScale=3
#t.ignitions=0.01

# Small animals.
# Rodents' deaths a year from all causes but predators, cold, snow and hunger.
#t.rodentDeath=1.2

# Residents' numbers and forage.
#t.breedSpacing=1.5
# Residents: weeks between their moves; share of usual numbers below which thin animals gather (0: none).
#t.residentMoveWeeks=1
#t.residentFloor=0.01
#t.proteinDryGrass=0.375
#t.proteinStraw=0.2
#t.youngProteinDeaths=0.25

# Movement: sense of better country, dens.
#t.bearingPull=0.5
#t.nearKm=60
#t.fadeKm=50
#t.denMonths=3
#t.denKm=15

# Rounds and rites.
#t.roundArrived=50
#t.seasonPull=1.0
#t.riteMax=3

# Trade goods.
#t.poorStoneEdge=0.75
#t.poorStoneWear=1
#t.saltLack=0.15
#t.saltKeep=0.7
