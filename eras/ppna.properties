# Pre-Pottery Neolithic A (Levant, about 10,000-8,800 BCE). Values are estimates; dates and sources from memory, to check.
# Villages of round, half-sunken houses, some of mudbrick (Jericho, Netiv Hagdud); wild cereals cultivated and sown, but most
# ears still shatter (morphologically domestic ears rare before about 8,500 BCE: Fuller and colleagues); el-Khiam arrowheads;
# no herds yet beyond the dog; the first town wall and tower (Jericho).
# People a village holds at the start: PPNA villages about 100-300 at the larger sites (Kuijt 2000, from memory); an estimate.
t.startVillagePeople=150
t.startSettled=0.2
t.startDomestic=0.1
t.startSkills=PIT_HOUSE:0.5,MUDBRICK:0.3,STONE_BOILING:0.5,LEACHING:0.4,FORTIFYING:0.3
t.startTools=SICKLE:1,GRINDER:0.5,BOW:0.5
